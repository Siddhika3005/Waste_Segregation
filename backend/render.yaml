# ============================================
# Render Blueprint - Backend Deployment Config
# ============================================
# This file defines the Render Web Service for the FastAPI backend.
# Deploy via: https://dashboard.render.com → New → Blueprint → connect your repo
#
# IMPORTANT: Your waste_model.h5 file (46MB) must be included in the repo
# or downloaded during the build step. Render has a free tier with 512MB RAM.
# If TensorFlow is too heavy, consider using TFLite (waste_model.tflite).

services:
  - type: web
    name: waste-segregation-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_PATH
        value: waste_model.h5
      - key: IMG_SIZE
        value: "224"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE
        value: "10485760"
    healthCheckPath: /health
    plan: free
