<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient512)" stroke="white" stroke-width="5"/>
  
  <!-- Leaf design -->
  <g transform="translate(256, 180)">
    <!-- Left leaf -->
    <path d="M -60 -50 Q -110 -100 -120 -150 Q -130 -100 -160 -50 Q -180 0 -150 50 Q -120 90 -60 100 Z" 
          fill="url(#leafGradient512)" opacity="0.95"/>
    
    <!-- Right leaf -->
    <path d="M 60 -50 Q 110 -100 120 -150 Q 130 -100 160 -50 Q 180 0 150 50 Q 120 90 60 100 Z" 
          fill="white" opacity="0.85"/>
    
    <!-- Center stem -->
    <rect x="-8" y="-70" width="16" height="180" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Accent dots -->
    <circle cx="0" cy="110" r="15" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Bottom text background -->
  <rect x="20" y="380" width="472" height="100" rx="20" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>
  
  <!-- Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="white" text-anchor="middle" letter-spacing="2">SMART WASTE</text>
  <text x="256" y="465" font-family="Arial, sans-serif" font-size="32" font-weight="600" 
        fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="1">SEGREGATION</text>
  
  <!-- Highlight shine -->
  <ellipse cx="150" cy="120" rx="80" ry="100" fill="white" opacity="0.1"/>
</svg>
