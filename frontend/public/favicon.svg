<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradientFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGradientFav)"/>
  
  <!-- Leaf design -->
  <g transform="translate(32, 22)">
    <!-- Left leaf -->
    <path d="M -8 -8 Q -14 -16 -16 -20 Q -18 -16 -22 -8 Q -24 0 -20 8 Q -16 12 -8 14 Z" 
          fill="url(#leafGradientFav)"/>
    
    <!-- Right leaf -->
    <path d="M 8 -8 Q 14 -16 16 -20 Q 18 -16 22 -8 Q 24 0 20 8 Q 16 12 8 14 Z" 
          fill="white" opacity="0.8"/>
    
    <!-- Center stem -->
    <rect x="-1" y="-10" width="2" height="24" rx="1" fill="white"/>
  </g>
  
  <!-- Shine effect -->
  <circle cx="20" cy="16" r="8" fill="white" opacity="0.15"/>
</svg>
