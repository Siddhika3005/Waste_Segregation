<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="white" stroke-width="2"/>
  
  <!-- Leaf shape for waste segregation -->
  <g transform="translate(100, 100)">
    <!-- Left leaf -->
    <path d="M -25 -20 Q -45 -40 -50 -60 Q -55 -40 -65 -20 Q -70 0 -60 20 Q -50 35 -25 40 Z" 
          fill="url(#leafGradient)" opacity="0.9"/>
    
    <!-- Right leaf -->
    <path d="M 25 -20 Q 45 -40 50 -60 Q 55 -40 65 -20 Q 70 0 60 20 Q 50 35 25 40 Z" 
          fill="white" opacity="0.8"/>
    
    <!-- Center stem -->
    <rect x="-3" y="-25" width="6" height="70" rx="3" fill="white" opacity="0.9"/>
    
    <!-- Accent circle -->
    <circle cx="0" cy="50" r="8" fill="white" opacity="0.85"/>
  </g>
  
  <!-- Highlight shine -->
  <circle cx="60" cy="60" r="35" fill="white" opacity="0.15"/>
</svg>
