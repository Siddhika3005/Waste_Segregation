    <!-- Center stem -->
    <rect x="-3" y="-28" width="6" height="72" rx="3" fill="white" opacity="0.95"/>
    
    <!-- Accent dot -->
    <circle cx="0" cy="44" r="6" fill="white" opacity="0.9"/>
