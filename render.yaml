# ============================================
# Render Blueprint - Root Level Config
# ============================================
# Render looks for render.yaml at the repository root for Blueprint deploys.
# This defines the backend web service.
#
# Deploy via: https://dashboard.render.com → New → Blueprint → connect your repo

services:
  - type: web
    name: waste-segregation-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_PATH
        value: waste_model.h5
      - key: IMG_SIZE
        value: "224"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE
        value: "10485760"
    healthCheckPath: /health
    plan: free
